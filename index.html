<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheep Shifters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050706;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #desk {
        position: relative;
        width: 100vw;
        height: 100dvh;
        background: #050706;
      }

      #tv-glass {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050706;
        box-shadow: inset 0 0 0 2px rgba(57, 255, 106, 0.14);
      }

      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #game canvas {
        display: block;
        outline: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #crt {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        overflow: hidden;
      }

      #crt::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.18) 2px,
          rgba(0, 0, 0, 0.18) 3px
        );
        opacity: 0.45;
        mix-blend-mode: multiply;
      }

      #crt::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 78% 72% at 50% 48%, transparent 42%, rgba(0, 0, 0, 0.32) 100%),
          linear-gradient(
            105deg,
            rgba(57, 255, 106, 0.025) 0%,
            transparent 35%,
            transparent 65%,
            rgba(61, 255, 242, 0.02) 100%
          );
      }

      #crt-glow {
        position: absolute;
        inset: 0;
        z-index: 19;
        pointer-events: none;
        background: radial-gradient(
          ellipse 90% 70% at 50% 40%,
          rgba(157, 255, 192, 0.035),
          transparent 65%
        );
        animation: phosphor 5.5s ease-in-out infinite;
      }

      @keyframes phosphor {
        0%,
        100% {
          opacity: 0.65;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #crt-glow {
          animation: none;
        }
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #050706;
        color: #39ff6a;
        font-family: "Press Start 2P", "Courier New", monospace;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #boot.hide {
        opacity: 0;
      }

      #boot .title {
        color: #ffe14a;
        font-size: clamp(14px, 2.8vw, 26px);
        text-align: center;
        line-height: 1.35;
        white-space: pre-line;
      }

      #boot .label {
        font-size: clamp(12px, 2vw, 16px);
        letter-spacing: 0.08em;
      }

      #boot .label::after {
        content: "";
        animation: dots 1s steps(3, end) infinite;
      }

      @keyframes dots {
        0% { content: ""; }
        33% { content: "."; }
        66% { content: ".."; }
        100% { content: "..."; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="title">SHEEP<br />SHIFTERS</div>
      <div class="label">LOADING</div>
    </div>
    <div id="desk">
      <div id="tv-glass">
        <div id="game"></div>
        <div id="crt-glow" aria-hidden="true"></div>
        <div id="crt" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
