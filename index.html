<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheep Shifters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050706;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #desk {
        position: relative;
        width: 100vw;
        height: 100dvh;
        background: #050706;
      }

      #tv-glass {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050706;
      }

      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #game canvas {
        display: block;
        outline: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #crt {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        overflow: hidden;
        box-shadow:
          inset 0 0 60px 24px rgba(0, 0, 0, 0.42),
          inset 0 0 120px 50px rgba(0, 0, 0, 0.28);
      }

      /* Scanlines */
      #crt::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.32) 2px,
          rgba(0, 0, 0, 0.32) 3px
        );
        opacity: 0.7;
        mix-blend-mode: multiply;
      }

      /* Viñeta + aberración cromática suave */
      #crt::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 76% 70% at 50% 48%, transparent 46%, rgba(0, 0, 0, 0.55) 100%);
        box-shadow:
          inset 2px 0 0 rgba(255, 60, 60, 0.045),
          inset -2px 0 0 rgba(60, 160, 255, 0.045);
        animation: crt-flicker 4.2s steps(2, end) infinite;
      }

      #crt-glow {
        position: absolute;
        inset: 0;
        z-index: 19;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 88% 68% at 50% 42%,
            rgba(255, 255, 255, 0.045),
            transparent 62%
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 0%,
            transparent 18%,
            transparent 82%,
            rgba(0, 0, 0, 0.12) 100%
          );
        animation: phosphor 5.5s ease-in-out infinite;
      }

      @keyframes phosphor {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes crt-flicker {
        0%,
        92%,
        100% {
          opacity: 1;
        }
        93% {
          opacity: 0.92;
        }
        94% {
          opacity: 1;
        }
        96% {
          opacity: 0.88;
        }
        97% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #crt-glow,
        #crt::after {
          animation: none;
        }
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #050706;
        color: #39ff6a;
        font-family: "Press Start 2P", "Courier New", monospace;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #boot.hide {
        opacity: 0;
      }

      #boot .title {
        color: #ffe14a;
        font-size: clamp(14px, 2.8vw, 26px);
        text-align: center;
        line-height: 1.35;
        white-space: pre-line;
      }

      #boot .label {
        font-size: clamp(12px, 2vw, 16px);
        letter-spacing: 0.08em;
      }

      #boot .label::after {
        content: "";
        animation: dots 1s steps(3, end) infinite;
      }

      @keyframes dots {
        0% { content: ""; }
        33% { content: "."; }
        66% { content: ".."; }
        100% { content: "..."; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="title">SHEEP<br />SHIFTERS</div>
      <div class="label">LOADING</div>
    </div>
    <div id="desk">
      <div id="tv-glass">
        <div id="game"></div>
        <div id="crt-glow" aria-hidden="true"></div>
        <div id="crt" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
